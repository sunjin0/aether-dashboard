<svg viewBox="0 0 256 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#667EEA;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:0.3" />
    </radialGradient>
    
    <linearGradient id="crystalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#667EEA;stop-opacity:0.8" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 简单动画 -->
    <style>
      @keyframes pulse {
        0%, 100% { r: 45; opacity: 0.3; }
        50% { r: 55; opacity: 0.1; }
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .pulse-ring { animation: pulse 3s infinite; }
      .rotate-anim { animation: rotate 15s linear infinite; }
    </style>
  </defs>

  <!-- 简化的晶体设计 - 六边形 -->
  <g transform="translate(128, 80)">
    <!-- 外层脉冲光环 -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#667EEA" stroke-width="1" class="pulse-ring" opacity="0.4"/>
    
    <!-- 中心发光球 -->
    <circle cx="0" cy="0" r="25" fill="url(#glowGradient)" filter="url(#glow)"/>
    
    <!-- 六边形晶体框 -->
    <g stroke="#00F0FF" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.9">
      <polygon points="0,-35 30,-17 30,17 0,35 -30,17 -30,-17" 
               stroke-width="1.5" opacity="0.7"/>
    </g>
    
    <!-- 内部流动线 -->
    <g class="rotate-anim" opacity="0.6">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="3,3"/>
    </g>
    
    <!-- 简单数据点 - 循环动画 -->
    <circle cx="0" cy="-20" r="2" fill="#00F0FF" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite">
        <mpath href="#orbit"/>
      </animateMotion>
    </circle>
    
    <path id="orbit" d="M 0,-20 A 20,20 0 0,1 20,0 A 20,20 0 0,1 0,20 A 20,20 0 0,1 -20,0 A 20,20 0 0,1 0,-20" fill="none"/>
    
    <!-- 顶部高光 -->
    <line x1="-3" y1="-30" x2="3" y2="-30" stroke="#FFFFFF" stroke-width="1" opacity="0.5" filter="url(#glow)"/>
  </g>

  <!-- 文字 "Aether" - 贴近logo -->
  <text x="128" y="210" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        text-anchor="middle" fill="#667EEA" letter-spacing="2">
    AETHER
  </text>
  
  <!-- 文字下方装饰线 -->
  <line x1="70" y1="225" x2="186" y2="225" stroke="#00F0FF" stroke-width="1" opacity="0.6"/>
</svg>
