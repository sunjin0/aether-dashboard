name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: aether-dashboard-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run tsc
      - run: npx jest --ci
      - run: npm run build
      - name: 整理发布产物
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"; STAGE="stage/release/$TAG/dashboard"
          mkdir -p "$STAGE/deploy"
          cp deploy/.dockerignore "$STAGE/.dockerignore"
          cp deploy/dashboard.Dockerfile deploy/release.sh deploy/compose.yml deploy/README.md "$STAGE/deploy/"
          cp -r deploy/nginx "$STAGE/deploy/nginx"
          cp -r dist "$STAGE/dist"
      - name: 构建镜像包
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"; STAGE="stage/release/$TAG/dashboard"
          docker buildx build --load --cache-from type=gha,scope=aether-dashboard --cache-to type=gha,mode=max -f "$STAGE/deploy/dashboard.Dockerfile" -t "aether-dashboard:release-$TAG" "$STAGE"
          docker save -o "$STAGE/images.tar" "aether-dashboard:release-$TAG"
      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?未配置 DEPLOY_HOST}"; : "${DEPLOY_USER:?未配置 DEPLOY_USER}"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: 上传并部署
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/aether-server' }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v[A-Za-z0-9_.-]+$ ]]
          RELEASE_ID="$(date -u +%Y%m%dT%H%M%SZ)-$TAG"; DEPLOY_PATH="$DEPLOY_ROOT/dashboard"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/releases/$RELEASE_ID'"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH/releases' '$DEPLOY_PATH/.releases/dashboard.previous'" <<'EOF'
          set -euo pipefail
          releases_dir="$1"; previous_state="$2"
          previous_release="$(sed -n 's/^release_id=//p' "$previous_state" 2>/dev/null || true)"
          if [[ -n "$previous_release" ]]; then
            find "$releases_dir" -type f -name images.tar ! -path "$releases_dir/$previous_release/*" -delete
          else
            mapfile -t archives < <(find "$releases_dir" -type f -name images.tar -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2-)
            if ((${#archives[@]})); then rm -f -- "${archives[@]}"; fi
          fi
          EOF
          rsync -az --delete -e "ssh -p ${DEPLOY_PORT:-22} -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120" "stage/release/$TAG/dashboard/" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$RELEASE_ID/dashboard/"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "docker load -i '$DEPLOY_PATH/releases/$RELEASE_ID/dashboard/images.tar'"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$DEPLOY_PATH/releases/$RELEASE_ID/dashboard/images.tar'"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "AETHER_PREBUILT_IMAGES=true bash '$DEPLOY_PATH/releases/$RELEASE_ID/dashboard/deploy/release.sh' dashboard '$TAG' '$DEPLOY_PATH' '$RELEASE_ID'"
